apiVersion: grafana.krm.kubed.io/v1alpha1
kind: Panel
metadata:
  name: openid-client-scope-protocol-mappers
spec:
  id: 20
  title: ''
  description: |
    The claims the scope adds to every token that requests it. Pick one on the left: what it maps,
    into which claim and JSON type, and which tokens it reaches.
  links: []
  data:
    kind: QueryGroup
    spec:
      queries:
      - kind: Embed
        spec:
          file: ../../../shared/from-header.yaml
      transformations: []
      queryOptions: {}
  vizConfig:
    kind: VizConfig
    group: marcusolsson-dynamictext-panel
    spec:
      options:
        renderMode: data
        contentPartials: []
        editor:
          format: auto
          language: html
        editors: []
        externalStyles:
        - id: kd
          url: ${assets}/kd.css
        status: ''
        wrap: false
        helpers: ''
        content: '<div class="kd"><kd-split key="keycloak-scope-mapper" empty="No mappers: it adds no claims of
          its own."></kd-split></div>'
        defaultContent: <div class="kd"><div class="none">Nothing to show.</div></div>
        afterRender:
          kind: Embed
          spec:
            file: protocol-mappers.afterRender.js
        styles: '.dt-row { height: 100%; padding: 4px 0 0; overflow: auto; }'
      fieldConfig:
        defaults: {}
        overrides: []
  transparent: true
