apiVersion: grafana.krm.kubed.io/v1alpha1
kind: Panel
metadata:
  name: openid-client-scope-usedby
spec:
  id: 21
  title: ''
  description: |
    Who gets this scope's claims: every client that requests it, as a default scope (always in the
    token) or an optional one (when the app asks), and whether its realm adds it to new clients.
  links: []
  data:
    kind: QueryGroup
    spec:
      queries:
      - kind: PanelQuery
        spec:
          refId: A
          hidden: false
          query:
            kind: DataQuery
            group: yesoreyeram-infinity-datasource
            version: v0
            datasource:
              name: kubernetes
            spec:
              type: json
              source: url
              parser: jq-backend
              format: table
              url: https://kubernetes.default.svc/apis/keycloak.kubed.io/v1alpha1/openidclients
              url_options:
                method: GET
                headers:
                - key: Accept
                  value: application/json
              root_selector: '[.items[] | {doc: tojson}]'
              columns: []
              filters: []
      - kind: PanelQuery
        spec:
          refId: B
          hidden: false
          query:
            kind: DataQuery
            group: yesoreyeram-infinity-datasource
            version: v0
            datasource:
              name: kubernetes
            spec:
              type: json
              source: url
              parser: jq-backend
              format: table
              url: https://kubernetes.default.svc/apis/keycloak.kubed.io/v1alpha1/realms
              url_options:
                method: GET
                headers:
                - key: Accept
                  value: application/json
              root_selector: '[.items[] | {doc: tojson}]'
              columns: []
              filters: []
      - kind: PanelQuery
        spec:
          refId: C
          hidden: false
          query:
            kind: DataQuery
            group: yesoreyeram-infinity-datasource
            version: v0
            datasource:
              name: kubernetes
            spec:
              type: json
              source: url
              parser: jq-backend
              format: table
              url: https://kubernetes.default.svc/apis/keycloak.kubed.io/v1alpha1/openidclientscopes?fieldSelector=metadata.name%3D${name}
              url_options:
                method: GET
                headers:
                - key: Accept
                  value: application/json
              root_selector: '[.items[] | {doc: tojson}]'
              columns: []
              filters: []
      transformations: []
      queryOptions: {}
  vizConfig:
    kind: VizConfig
    group: marcusolsson-dynamictext-panel
    spec:
      options:
        renderMode: data
        contentPartials: []
        editor:
          format: auto
          language: html
        editors: []
        externalStyles:
        - id: kd
          url: ${assets}/kd.css
        status: ''
        wrap: false
        helpers: ''
        content: <div class="kd"><kd-table id="usedby" empty="No client requests it."></kd-table></div>
        defaultContent: <div class="kd"><div class="none">Nothing to show.</div></div>
        afterRender:
          kind: Embed
          spec:
            file: usedby.afterRender.js
        styles: '.dt-row { height: 100%; padding: 4px 0 0; overflow: auto; }'
      fieldConfig:
        defaults: {}
        overrides: []
  transparent: true
