apiVersion: grafana.krm.kubed.io/v1alpha1
kind: Panel
metadata:
  name: realm-bad-passwords
spec:
  id: 13
  title: Wrong passwords
  description: |
    Password checks that failed in this realm. Logins through LDAP are checked by the directory, so
    they do not count here.
  links: []
  data:
    kind: QueryGroup
    spec:
      queries:
      - kind: PanelQuery
        spec:
          refId: A
          hidden: false
          query:
            kind: DataQuery
            group: prometheus
            version: v0
            datasource:
              name: prometheus
            spec:
              expr: sum(((increase(keycloak_credentials_password_hashing_validations_total{realm="${name}", outcome!="valid"}[$__range])
                + (min_over_time(keycloak_credentials_password_hashing_validations_total{realm="${name}", outcome!="valid"}[$__range])
                unless keycloak_credentials_password_hashing_validations_total{realm="${name}", outcome!="valid"}
                offset $__range)) or increase(keycloak_credentials_password_hashing_validations_total{realm="${name}",
                outcome!="valid"}[$__range]) or (min_over_time(keycloak_credentials_password_hashing_validations_total{realm="${name}",
                outcome!="valid"}[$__range]) unless keycloak_credentials_password_hashing_validations_total{realm="${name}",
                outcome!="valid"} offset $__range))) or vector(0)
              legendFormat: ''
              range: false
              instant: true
              format: table
      transformations: []
      queryOptions: {}
  vizConfig:
    kind: VizConfig
    group: stat
    spec:
      options:
        reduceOptions:
          calcs:
          - lastNotNull
          fields: ''
          values: false
        colorMode: value
        graphMode: none
        textMode: value
        justifyMode: center
      fieldConfig:
        defaults:
          unit: short
          decimals: 0
          noValue: '0'
          color:
            mode: thresholds
          thresholds:
            mode: absolute
            steps:
            - color: text
              value: null
            - color: orange
              value: 1
        overrides: []
