# The Realm picker, then what the shared panels and the tabs read.
kind: QueryVariable
spec:
  name: name
  current:
    text: ''
    value: ''
  label: Realm
  hide: dontHide
  refresh: onDashboardLoad
  skipUrlSync: false
  query:
    kind: DataQuery
    group: yesoreyeram-infinity-datasource
    version: v0
    datasource:
      name: kubernetes
    spec:
      infinityQuery:
        columns: []
        filters: []
        format: table
        parser: jq-backend
        refId: variable
        root_selector: '[.items[] | {v: .metadata.name}]'
        source: url
        type: json
        url: https://kubernetes.default.svc/apis/keycloak.kubed.io/v1alpha1/realms
        url_options:
          headers:
          - key: Accept
            value: application/json
          method: GET
      query: ''
      queryType: infinity
      refId: variable
  regex: ''
  regexApplyTo: value
  sort: alphabeticalAsc
  definition: https://kubernetes.default.svc/apis/keycloak.kubed.io/v1alpha1/realms
  options: []
  multi: false
  includeAll: false
  allowCustomValue: true
  description: The Realm to show, by metadata.name
---
kind: ConstantVariable
spec:
  name: kind
  query: Realm
  current:
    text: Realm
    value: Realm
  hide: hideVariable
  skipUrlSync: true
  description: This dashboard's kind, for the shared panels
---
kind: ConstantVariable
spec:
  name: plural
  query: realms
  current:
    text: realms
    value: realms
  hide: hideVariable
  skipUrlSync: true
  description: Its resource name in keycloak.kubed.io/v1alpha1, for the shared panels
