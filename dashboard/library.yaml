# The one grafana.krm.kubed.io function: builds every keycloak-components dashboard into the Keycloak
# folder under apps, embedding the panels each names, and marks everything it used local-config.
apiVersion: grafana.krm.kubed.io/v1alpha1
kind: GrafanaLibrary
metadata:
  name: keycloak-components
  # transformer output misses the kustomization's namespace, so the library carries it
  namespace: observe
  labels:
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: keycloak
    app.kubernetes.io/instance: grafana
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: kubectl-kubed
spec:
  # created under apps (uid cfyzcbzldfg1sa), next to the Keycloak app dashboard
  folder:
    title: Keycloak
    parent: cfyzcbzldfg1sa
  dashboards:
    matchLabels:
      grafana.kubed.io/dashboard: keycloak-components
