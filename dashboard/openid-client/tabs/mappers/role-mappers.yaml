apiVersion: grafana.krm.kubed.io/v1alpha1
kind: Panel
metadata:
  name: client-role-mappers
spec:
  id: 22
  title: ''
  description: |
    Where the client's roles come from: each role mapper, in words. An LDAP one reads the role
    entries under a DN at login; the Activity tab charts its syncs.
  links: []
  data:
    kind: QueryGroup
    spec:
      queries:
      - kind: Embed
        spec:
          file: ../../../shared/from-header.yaml
      transformations: []
      queryOptions: {}
  vizConfig:
    kind: VizConfig
    group: marcusolsson-dynamictext-panel
    spec:
      options:
        renderMode: data
        contentPartials: []
        editor:
          format: auto
          language: html
        editors: []
        externalStyles:
        - id: kd
          url: ${assets}/kd.css
        status: ''
        wrap: false
        helpers: ''
        content: <div class="kd"><div id="rolemappers" class="cols"></div></div>
        defaultContent: <div class="kd"><div class="none">Nothing to show.</div></div>
        afterRender:
          kind: Embed
          spec:
            file: role-mappers.afterRender.js
        styles: '.dt-row { height: 100%; padding: 4px 0 0; overflow: auto; }'
      fieldConfig:
        defaults: {}
        overrides: []
  transparent: true
