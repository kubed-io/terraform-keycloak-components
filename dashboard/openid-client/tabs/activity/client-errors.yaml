apiVersion: grafana.krm.kubed.io/v1alpha1
kind: Panel
metadata:
  name: client-errors
spec:
  id: 13
  title: Errors
  description: 'Any event that failed, of any type: a wrong redirect URI, an expired code, a bad secret.'
  links: []
  data:
    kind: QueryGroup
    spec:
      queries:
      - kind: PanelQuery
        spec:
          refId: A
          hidden: false
          query:
            kind: DataQuery
            group: prometheus
            version: v0
            datasource:
              name: prometheus
            spec:
              expr: sum(((increase(keycloak_user_events_total{job="keycloak-service", realm="${realm}", client_id="${name}",
                error!=""}[$__range]) + (min_over_time(keycloak_user_events_total{job="keycloak-service", realm="${realm}",
                client_id="${name}", error!=""}[$__range]) unless keycloak_user_events_total{job="keycloak-service",
                realm="${realm}", client_id="${name}", error!=""} offset $__range)) or increase(keycloak_user_events_total{job="keycloak-service",
                realm="${realm}", client_id="${name}", error!=""}[$__range]) or (min_over_time(keycloak_user_events_total{job="keycloak-service",
                realm="${realm}", client_id="${name}", error!=""}[$__range]) unless keycloak_user_events_total{job="keycloak-service",
                realm="${realm}", client_id="${name}", error!=""} offset $__range))) or vector(0)
              legendFormat: ''
              range: false
              instant: true
              format: table
      transformations: []
      queryOptions: {}
  vizConfig:
    kind: VizConfig
    group: stat
    spec:
      options:
        reduceOptions:
          calcs:
          - lastNotNull
          fields: ''
          values: false
        colorMode: value
        graphMode: none
        textMode: value
        justifyMode: center
        orientation: auto
      fieldConfig:
        defaults:
          unit: short
          decimals: 0
          noValue: '0'
          color:
            mode: thresholds
          thresholds:
            mode: absolute
            steps:
            - color: text
              value: null
            - color: red
              value: 1
        overrides: []
