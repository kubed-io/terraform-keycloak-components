# yaml-language-server: $schema=http://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: keycloak-components-dashboards
  annotations:
    kubernetes.io/description: |
      One dashboard per keycloak.kubed.io kind (Realm, OpenidClient, OpenidClientScope, LdapFederation,
      Workflow) in the Keycloak folder under apps, applied on its own with `kubectl up dashboard`. Each
      reads one object live from the Kubernetes API with its Workspace, conditions, events and Keycloak
      activity, built from grafana.krm.kubed.io sources (kubed-krm) into GrafanaManifests.
    # dashboards outgrow client-side apply's 256 KiB annotation
    kubectl.kubernetes.io/server-side: "true"
namespace: observe
# reaches every resource here; the library copies each dashboard.yaml's onto its GrafanaManifest
labels:
- pairs:
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: keycloak
    app.kubernetes.io/instance: grafana
resources:
# the header, status and YAML panels every dashboard names
- shared
- realm
- openid-client
- openid-client-scope
- ldap-federation
- workflow
# lets Embed paths resolve next to the file they are written in
buildMetadata:
- originAnnotations
# the one function: everything above is data it turns into operator resources
transformers:
- library.yaml
