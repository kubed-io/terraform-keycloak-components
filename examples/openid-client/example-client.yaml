apiVersion: keycloak.kubed.io/v1alpha1
kind: OpenidClient
metadata:
  name: example-web-app
spec:
  # Required fields
  realm: master
  accessType: CONFIDENTIAL
  
  # Optional basic settings
  enabled: true
  description: "Example web application client"
  
  # Access settings - URLs and redirects
  accessSettings:
    rootUrl: "https://example.com"
    redirectUris:
      - "https://example.com/oauth/callback"
      - "http://localhost:3000/*"
    webOrigins:
      - "+"
  
  # Capabilities - Enable OAuth2 flows
  capabilities:
    standardFlowEnabled: true
    directAccessGrantsEnabled: true
    pkceCodeChallengeMethod: S256
  
  # Only roles from this client's scope mappings go into tokens
  fullScopeAllowed: false

  # Advanced settings - per-client lifespans in seconds
  tokens:
    accessTokenLifespan: "300"

  # OpenID Connect compatibility modes
  compatibility:
    useRefreshTokens: true
    excludeSessionStateFromAuthResponse: false

  # Client scopes
  scopes:
    default:
      - email
      - profile
    optional:
      - offline_access
  
  # Protocol mappers
  protocolMappers:
    - name: email
      type: userProperty
      userProperty:
        name: email
        claimName: email
        addToIdToken: true
        addToAccessToken: true
        addToUserinfo: true
    
    - name: groups
      type: groupMembership
      groupMembership:
        claimName: groups
        fullPath: false
        addToIdToken: true
        addToAccessToken: true
